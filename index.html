<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Willi Wolff — moved to williwolff.com</title>

    <!-- This site has moved. The canonical tag plus the refresh tells search
         engines to consolidate onto the new host rather than treat this as a
         duplicate; deliberately NOT noindex, which would drop the page instead
         of passing its signals along. -->
    <link rel="canonical" href="https://williwolff.com/">
    <meta http-equiv="refresh" content="0; url=https://williwolff.com/">
    <meta name="description" content="Willi Wolff, software engineer and technical architect. This site has moved to williwolff.com.">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #09090b;
            color: #e4e4e7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        a { color: #2dd4bf; }
    </style>
</head>
<body>
    <main>
        <h1>Willi Wolff</h1>
        <p>This site now lives at <a href="https://williwolff.com/">williwolff.com</a>.</p>
    </main>
    <script>window.location.replace('https://williwolff.com/');</script>
</body>
</html>
